name: examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  meraki-alert-triage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/meraki-alert-triage/agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  client-names:
    # Examples are public: fail if a client name slips in. The list lives in a
    # repository secret so the names themselves are never published here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan for denied names
        env:
          DENYLIST: ${{ secrets.CLIENT_NAME_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then echo "CLIENT_NAME_DENYLIST not set; skipping"; exit 0; fi
          found=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if grep -rIil --exclude-dir=.git -- "$name" . ; then found=1; fi
          done <<< "$(printf '%s\n' "$DENYLIST" | tr ',' '\n')"
          exit $found
