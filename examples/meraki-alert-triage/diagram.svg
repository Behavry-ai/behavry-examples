<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Every call passes through Behavry; device actions wait for a person" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5B6577"/>
    </marker>
  </defs>
  <!-- Behavry container -->
  <rect x="368" y="16" width="184" height="316" rx="10" fill="#D4A843" fill-opacity="0.10" stroke="#C8922A" stroke-width="2"/>
  <text x="384" y="40" font-weight="700" fill="#1B2A4A">Behavry</text>
  <text x="384" y="56" font-size="11" fill="#5B6577">signed Decision Trace</text>

  <g fill="none" stroke="#5B6577" stroke-width="1.25">
    <path d="M160 108H184" marker-end="url(#arrow)"/>
    <path d="M336 108H384" marker-end="url(#arrow)"/>
    <path d="M260 136V196H384" marker-end="url(#arrow)"/>
    <path d="M536 108H562" marker-end="url(#arrow)"/>
    <path d="M536 196H562" marker-end="url(#arrow)"/>
    <path d="M460 224V256" marker-end="url(#arrow)"/>
    <path d="M536 284H562" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>
  <text x="272" y="188" font-size="11" fill="#5B6577">tool calls</text>
  <text x="468" y="244" font-size="11" fill="#5B6577">device actions</text>

  <g fill="#FFFFFF" stroke="#1B2A4A" stroke-opacity="0.35" stroke-width="1.25">
    <rect x="24" y="80" width="136" height="56" rx="8"/>
    <rect x="184" y="80" width="152" height="56" rx="8"/>
    <rect x="384" y="80" width="152" height="56" rx="8"/>
    <rect x="384" y="168" width="152" height="56" rx="8"/>
    <rect x="384" y="256" width="152" height="56" rx="8"/>
    <rect x="562" y="80" width="176" height="56" rx="8"/>
    <rect x="562" y="168" width="176" height="56" rx="8"/>
    <rect x="562" y="256" width="176" height="56" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="92" y="104" font-weight="600" fill="#0A1628">Meraki</text>
    <text x="92" y="122" font-size="11.5" fill="#5B6577">alert webhook</text>
    <text x="260" y="104" font-weight="600" fill="#0A1628">Triage agent</text>
    <text x="260" y="122" font-size="11.5" fill="#5B6577">hosted, one replica</text>
    <text x="460" y="104" font-weight="600" fill="#0A1628">Model proxy</text>
    <text x="460" y="122" font-size="11.5" fill="#5B6577">records each call</text>
    <text x="460" y="192" font-weight="600" fill="#0A1628">Tool gateway</text>
    <text x="460" y="210" font-size="11.5" fill="#5B6577">policy per system</text>
    <text x="460" y="280" font-weight="600" fill="#0A1628">Approval queue</text>
    <text x="460" y="298" font-size="11.5" fill="#5B6577">held until decided</text>
    <text x="650" y="104" font-weight="600" fill="#0A1628">Claude</text>
    <text x="650" y="122" font-size="11.5" fill="#5B6577">triage, fixed fields</text>
    <text x="650" y="192" font-weight="600" fill="#0A1628">PSA / RMM gateway</text>
    <text x="650" y="210" font-size="11.5" fill="#5B6577">Halo, Meraki, RMM</text>
    <text x="650" y="280" font-weight="600" fill="#0A1628">Technician</text>
    <text x="650" y="298" font-size="11.5" fill="#5B6577">approves or rejects</text>
  </g>
</svg>
